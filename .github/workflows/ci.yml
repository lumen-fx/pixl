name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install the system libraries the Lumen engine links
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  perf:
    # The editor's frame budget on the 4096x4096 document of 32 layers,
    # against the limits in app/benches/gate.json, on the CPU renderer.
    # The limits were set on a desktop and runners are slower, so this job
    # prints every number and fails only when the bench does; the local run
    # of `cpu gate` enforces them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install the system libraries the Lumen engine links
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev
      - run: cargo bench -p pixl --bench view -- cpu gate report
